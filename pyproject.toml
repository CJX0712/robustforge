[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustforge"
version = "1.0.0"
description = "对抗鲁棒性 / 对抗机器学习系统 (作者: 晨星) — 纯 numpy 离线兜底 + FGSM/PGD/CW + 对抗训练 + RobustFuse-AT 旗舰"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
dependencies = ["numpy>=1.24", "scipy>=1.9", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
xai-backends = ["shap", "lime"]  # 可选：仅用于与顶级开源交叉验证，非核心依赖

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["robustforge*"]
